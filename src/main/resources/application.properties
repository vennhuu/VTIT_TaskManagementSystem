spring.application.name=TaskManagementSystem

# Data Source
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL}
logging.level.org.hibernate.SQL=DEBUG

# JWT
venn.jwt.base64-secret=${JWT_SECRET}
venn.jwt.access-token-validity-in-seconds=${JWT_ACCESS_EXPIRE}
venn.jwt.refresh-token-validity-in-seconds=${JWT_REFRESH_EXPIRE}

# config pageable 
spring.data.web.pageable.page-parameter=currentPage
spring.data.web.pageable.size-parameter=pageSize
spring.data.web.pageable.one-indexed-parameters=true

###
#config email with Gmail
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}

spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
###
#

#config redis 
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# config rabbitmq
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# spring.rabbitmq.listener.simple.acknowledge-mode=manual

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.default-requeue-rejected=false